# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# Web sayfasının dili (Türkçe için 'tr')
lang: tr

# Zaman dilimi
timezone: Europe/Istanbul

# jekyll-seo-tag ayarları
# ↓ --------------------------

title: Telsiz Rehberi # Ana başlık

tagline: Telsiz Kurulum Rehberleri ve Teknik Dosyalar # Alt başlık

description: >- # SEO açıklaması
  Amatör telsiz frekans yükleme, cihaz kurulum rehberleri ve ücretsiz teknik yazılım paylaşım platformu.

# Sitenizin tam adresi (sonunda / olmadan)
url: "https://telsizrehberi.cengizkaya.net"

github:
  username: cengi7 # GitHub kullanıcı adınız

twitter:
  username: # Varsa Twitter/X kullanıcı adınız

social:
  name: Cengiz Kaya
  email: # e-posta adresiniz (opsiyonel)
  fediverse_handle:
  links:
    - https://github.com/cengi7 # GitHub profil bağlantınız

# Site Doğrulama Ayarları (İsteğe bağlı)
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# `jekyll-seo-tag` ayarlarının sonu

# Web Analiz Ayarları (İsteğe bağlı)
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Sayfa görüntülenme ayarları
pageviews:
  provider:

# Tema Modu (Boş bırakırsanız sistem modunu takip eder ve sol altta değiştirme butonu çıkar)
# Seçenekler: light | dark
theme_mode:

# Medya kaynakları için CDN adresi (Gerekmedikçe boş bırakın)
cdn:

# Sol menüdeki avatar / profil resmi (Assets klasörüne ekleyeceğiniz resim yolu)
avatar: /assets/img/avatar.png

# SEO sosyal medya önizleme görseli
social_preview_image:

# İçindekiler tablosu (TOC) anahtarı
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# Sitenin kök dizin yolu (Özel alan adı kullanıldığı için boş kalmalıdır)
baseurl: ""

# ------------ Aşağıdaki ayarların değiştirilmesi önerilmez ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
