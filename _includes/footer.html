<!-- The Footer -->
<footer aria-label="Site Info" class="d-flex flex-column justify-content-center text-muted flex-lg-row justify-content-lg-between align-items-lg-center pb-md-3">
  <p class="mb-0">
    © {{ 'now' | date: '%Y' }}
    <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
    <span data-bs-toggle="tooltip" data-bs-placement="top" title="{{ site.data.locales[site.lang].copyright.verbose }}">
      {{ site.data.locales[site.lang].copyright.brief }}
    </span>
  </p>
</footer>

<!-- Chirpy Tam Uyumlu Tema, Font ve Arşiv Düzeltme Kodu -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* 1. TÜM METİNLERE INTER FONTU */
  body, h1, h2, h3, h4, h5, h6, p, button, input, select, textarea, .post-title, .site-title, .nav-link, .title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }

  /* 2. İKON SİSTEMİNİ KORUMA (FontAwesome) */
  i, .fa, .fas, .far, .fab, .fal, .fad, [class^="fa-"], [class*=" fa-"] {
    font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
  }

  /* 3. KOYU MOD (DARK MODE - saygiselim.dev) */
  html[data-mode="dark"],
  html:not([data-mode="light"]) {
    --main-bg: #0b0d11 !important;
    --mask-bg: #12151c !important;
    --main-border-color: #1e232d !important;
    --sidebar-bg: #0d0f14 !important;
    --sidebar-border-color: #1e232d !important;
    --card-bg: #12151c !important;
    --card-header-bg: #161b22 !important;
    --tb-border-color: #1e232d !important;
    --text-color: #c9d1d9 !important;
    --text-muted-color: #8b949e !important;
    --heading-color: #f0f6fc !important;
    --link-color: #38bdf8 !important;
    --nav-link-color: #9198a1 !important;
    --sidebar-active-color: #38bdf8 !important;
    --topbar-bg: #0b0d11 !important;
    --topbar-text-color: #f0f6fc !important;
    --search-wrapper-bg: #12151c !important;
    --search-wrapper-border-color: #1e232d !important;
    --search-tag-bg: #161b22 !important;
    --tag-bg: #161b22 !important;
    --tag-border: #30363d !important;
    --tag-shadow: none !important;
    --timeline-color: #1e232d !important;
    --timeline-node-bg: #8b949e !important;
    --timeline-year-dot-color: #38bdf8 !important;
  }

  /* Koyu Mod Zemin Yapılandırması */
  html[data-mode="dark"] body,
  html:not([data-mode="light"]) body,
  html[data-mode="dark"] #main-wrapper,
  html:not([data-mode="light"]) #main-wrapper {
    background-color: #0b0d11 !important;
    color: #c9d1d9 !important;
  }

  html[data-mode="dark"] #sidebar,
  html:not([data-mode="light"]) #sidebar {
    background-color: #0d0f14 !important;
  }

  /* 4. AÇIK MOD (LIGHT MODE) DÜZELTMESİ */
  html[data-mode="light"] {
    --main-bg: #ffffff !important;
    --mask-bg: #ffffff !important;
    --main-border-color: #e1e4e8 !important;
    --sidebar-bg: #f6f8fa !important;
    --sidebar-border-color: #e1e4e8 !important;
    --card-bg: #ffffff !important;
    --card-header-bg: #f6f8fa !important;
    --tb-border-color: #e1e4e8 !important;
    --text-color: #24292f !important;
    --text-muted-color: #57606a !important;
    --heading-color: #1f2328 !important;
    --link-color: #0969da !important;
    --nav-link-color: #57606a !important;
    --sidebar-active-color: #0969da !important;
    --topbar-bg: #ffffff !important;
    --topbar-text-color: #1f2328 !important;
    --search-wrapper-bg: #f6f8fa !important;
    --search-wrapper-border-color: #d0d7de !important;
    --tag-bg: #f3f4f6 !important;
    --tag-border: #d0d7de !important;
    --timeline-color: #d0d7de !important;
    --timeline-node-bg: #8c959f !important;
    --timeline-year-dot-color: #0969da !important;
  }

  html[data-mode="light"] body,
  html[data-mode="light"] #main-wrapper {
    background-color: #ffffff !important;
    color: #24292f !important;
  }

  html[data-mode="light"] #sidebar {
    background-color: #f6f8fa !important;
  }

  /* 5. ARŞİV ZAMAN ÇİZGİSİ DÜZELTMESİ */
  #archives ul.timeline {
    padding-left: 1.5rem !important;
    border-left: 2px solid var(--timeline-color) !important;
  }

  #archives .year {
    position: relative !important;
    left: calc(-1.5rem - 1px) !important;
    background-color: transparent !important;
  }

  #archives li {
    background-color: transparent !important;
  }

  /* Oval Etiket Tasarımı */
  .tag, .post-tag, #access-tags .tag {
    border-radius: 20px !important;
    padding: 4px 12px !important;
  }
</style>
