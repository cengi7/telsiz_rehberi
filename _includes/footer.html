<!-- The Footer -->
<footer aria-label="Site Info" class="d-flex flex-column justify-content-center text-muted flex-lg-row justify-content-lg-between align-items-lg-center pb-md-3">
  <p class="mb-0">
    © {{ 'now' | date: '%Y' }}
    <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
    <span data-bs-toggle="tooltip" data-bs-placement="top" title="{{ site.data.locales[site.lang].copyright.verbose }}">
      {{ site.data.locales[site.lang].copyright.brief }}
    </span>
  </p>
</footer>

<!-- Saygiselim.dev Tasarım & İkon Onarım Kodu -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* 1. TÜM METİNLERE INTER FONTU */
  body, h1, h2, h3, h4, h5, h6, p, button, input, select, textarea, .post-title, .site-title, .nav-link {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }

  /* 2. İKONLARI KORUMA (BOZULAN KUTULARI DÜZELTİR) */
  i, .fa, .fas, .far, .fab, .fal, .fad, [class^="fa-"], [class*=" fa-"] {
    font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
  }

  /* 3. ZEMİN VE DERİN KOYU TEMA */
  body, #main-wrapper, #sidebar, #topbar-wrapper, #search-result-wrapper, html {
    background-color: #0b0d11 !important;
    color: #c9d1d9 !important;
  }

  /* Sol Menü Yapısı */
  #sidebar {
    background-color: #0d0f14 !important;
    border-right: 1px solid #1e232d !important;
  }

  .nav-item .nav-link {
    color: #9198a1 !important;
  }

  .nav-item.active .nav-link {
    background-color: #161b22 !important;
    color: #38bdf8 !important;
    border-radius: 8px !important;
  }

  /* 4. MAKALE KARTLARI (DÜZGÜN ÇERÇEVELİ KUTULAR) */
  #post-list .card, .card, .card-body {
    background-color: #12151c !important;
    border: 1px solid #1e232d !important;
    border-radius: 12px !important;
    box-shadow: none !important;
  }

  /* 5. ALT BİLGİ (FOOTER) ŞEFFAFLAŞTIRMA VE HİZALAMA */
  footer, #footer, .pb-md-3 {
    background-color: transparent !important;
    border-top: 1px solid #1e232d !important;
    margin-top: 2rem !important;
    padding-top: 1.5rem !important;
  }

  /* 6. ARAMA KUTUSU VE OVAL ETİKETLER */
  #search-input {
    background-color: #12151c !important;
    border: 1px solid #1e232d !important;
    color: #f0f6fc !important;
  }

  .tag, .post-tag, #access-tags .tag {
    background-color: #161b22 !important;
    border: 1px solid #30363d !important;
    color: #e6edf3 !important;
    border-radius: 20px !important;
    padding: 4px 12px !important;
  }

  a {
    color: #38bdf8 !important;
  }
</style>
