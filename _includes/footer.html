<!-- The Footer -->
<footer aria-label="Site Info" class="d-flex flex-column justify-content-center text-muted flex-lg-row justify-content-lg-between align-items-lg-center pb-md-3">
  <p class="mb-0">
    © {{ 'now' | date: '%Y' }}
    <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
    <span data-bs-toggle="tooltip" data-bs-placement="top" title="{{ site.data.locales[site.lang].copyright.verbose }}">
      {{ site.data.locales[site.lang].copyright.brief }}
    </span>
  </p>
</footer>

<!-- Temiz Tema, Font ve Kusursuz Arşiv Hizalama Kodu -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* 1. INTER FONTU & İKON KORUMA */
  body, h1, h2, h3, h4, h5, h6, p, button, input, select, textarea, .post-title, .site-title, .nav-link, .title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }

  i, .fa, .fas, .far, .fab, .fal, .fad, [class^="fa-"], [class*=" fa-"] {
    font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
  }

  /* 2. KOYU MOD (DARK MODE - saygiselim.dev) */
  html[data-mode="dark"],
  html:not([data-mode="light"]) {
    --main-bg: #0b0d11;
    --sidebar-bg: #0d0f14;
    --card-bg: #12151c;
    --border-color: #1e232d;
    --text-main: #c9d1d9;
    --text-muted: #8b949e;
    --heading-color: #f0f6fc;
    --accent-blue: #38bdf8;
    --active-link-bg: #161b22;
  }

  /* 3. AÇIK MOD (LIGHT MODE - TEMİZ BEYAZ & YÜKSEK KONTRAST) */
  html[data-mode="light"] {
    --main-bg: #ffffff;
    --sidebar-bg: #f6f8fa;
    --card-bg: #ffffff;
    --border-color: #d0d7de;
    --text-main: #1f2328;
    --text-muted: #656d76;
    --heading-color: #000000;
    --accent-blue: #0969da;
    --active-link-bg: #ddf4ff; /* Açık mavi yüksek kontrastlı zemin */
  }

  /* 4. GENEL RENK UYGULAMASI */
  body, #main-wrapper, #topbar-wrapper, #search-result-wrapper {
    background-color: var(--main-bg) !important;
    color: var(--text-main) !important;
  }

  #sidebar {
    background-color: var(--sidebar-bg) !important;
    border-right: 1px solid var(--border-color) !important;
  }

  /* Sol Menü Linkleri ve Aktif Sekme Düzeltmesi */
  .nav-item .nav-link {
    color: var(--text-muted) !important;
  }

  /* KOYU MOD AKTİF BUTON */
  html[data-mode="dark"] .nav-item.active .nav-link,
  html:not([data-mode="light"]) .nav-item.active .nav-link {
    background-color: #161b22 !important;
    color: #38bdf8 !important;
    font-weight: 600 !important;
    border-radius: 8px !important;
  }

  /* AÇIK MOD AKTİF BUTON (ARŞİV YAZISINI NET OKUNUR YAPAR) */
  html[data-mode="light"] .nav-item.active .nav-link {
    background-color: #ddf4ff !important;
    color: #0969da !important;
    font-weight: 700 !important;
    border-radius: 8px !important;
  }

  /* Kartlar ve Arama Kutusu */
  #post-list .card, .post-content .card {
    background-color: var(--card-bg) !important;
    border: 1px solid var(--border-color) !important;
    border-radius: 12px !important;
    box-shadow: none !important;
  }

  #search-input, .search-wrapper {
    background-color: var(--sidebar-bg) !important;
    border: 1px solid var(--border-color) !important;
    color: var(--text-main) !important;
  }

  .tag, .post-tag, #access-tags .tag {
    background-color: var(--sidebar-bg) !important;
    border: 1px solid var(--border-color) !important;
    color: var(--text-main) !important;
    border-radius: 20px !important;
    padding: 4px 12px !important;
  }

  a {
    color: var(--accent-blue) !important;
  }

  /* 5. ARŞİV ZAMAN ÇİZGİSİ VE NOKTA HİZALAMA (KAYMA DÜZELTMESİ) */
  #archives {
    position: relative !important;
  }

  #archives .timeline {
    position: relative !important;
    border-left: 2px solid var(--border-color) !important;
    margin-left: 4.8rem !important; /* Dikey çizginin sabit yeri */
    padding-left: 1.5rem !important;
    list-style: none !important;
  }

  /* 2026 Yıl Noktasını Dikey Çizginin Tam Üstüne Merkezleme */
  #archives .year {
    position: relative !important;
    margin-left: 0 !important;
    color: var(--heading-color) !important;
  }

  #archives .year::before {
    content: "" !important;
    position: absolute !important;
    left: 4.8rem !important; /* Dikey çizgi ile %100 aynı x-koordinatı */
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 12px !important;
    height: 12px !important;
    border-radius: 50% !important;
    border: 2px solid var(--accent-blue) !important;
    background-color: var(--main-bg) !important;
    z-index: 5 !important;
  }

  /* Alt Makale Satırları */
  #archives .timeline li {
    background: transparent !important;
    border: none !important;
    position: relative !important;
  }

  /* Alt Makale Noktasını Çizgiye Merkezleme */
  #archives .timeline li::before {
    left: -1.5rem !important;
    transform: translate(-50%, -50%) !important;
    top: 50% !important;
    background-color: var(--text-muted) !important;
  }

  footer, #footer, .pb-md-3 {
    background-color: transparent !important;
    border-top: 1px solid var(--border-color) !important;
    margin-top: 2rem !important;
    padding-top: 1.5rem !important;
  }
</style>
