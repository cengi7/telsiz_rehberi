<!-- The Footer -->
<footer aria-label="Site Info" class="d-flex flex-column justify-content-center text-muted flex-lg-row justify-content-lg-between align-items-lg-center pb-md-3">
  <p class="mb-0">
    © {{ 'now' | date: '%Y' }}
    <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
    <span data-bs-toggle="tooltip" data-bs-placement="top" title="{{ site.data.locales[site.lang].copyright.verbose }}">
      {{ site.data.locales[site.lang].copyright.brief }}
    </span>
  </p>
</footer>

<!-- Chirpy Tam Uyumlu Tema, Font ve Arşiv Düzeltme Kodu -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  /* 1. TÜM METİNLERE INTER FONTU */
  body, h1, h2, h3, h4, h5, h6, p, button, input, select, textarea, .post-title, .site-title, .nav-link, .title {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  }

  /* 2. İKON SİSTEMİNİ KORUMA (FontAwesome) */
  i, .fa, .fas, .far, .fab, .fal, .fad, [class^="fa-"], [class*=" fa-"] {
    font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands", "FontAwesome" !important;
  }

  /* 3. DİNAMİK TEMA DEĞİŞKENLERİ (CSS VARIABLES) */
  
  /* KOYU MOD (DARK MODE - saygiselim.dev) */
  html[data-mode="dark"],
  html:not([data-mode="light"]) {
    --main-bg: #0b0d11;
    --mask-bg: #12151c;
    --main-border-color: #1e232d;
    --sidebar-bg: #0d0f14;
    --sidebar-border-color: #1e232d;
    --card-bg: #12151c;
    --card-header-bg: #161b22;
    --tb-border-color: #1e232d;
    --text-color: #c9d1d9;
    --text-muted-color: #8b949e;
    --heading-color: #f0f6fc;
    --link-color: #38bdf8;
    --nav-link-color: #9198a1;
    --sidebar-active-color: #38bdf8;
    --topbar-bg: #0b0d11;
    --topbar-text-color: #f0f6fc;
    --search-wrapper-bg: #12151c;
    --search-wrapper-border-color: #1e232d;
    --tag-bg: #161b22;
    --tag-border: #30363d;
    --timeline-color: #1e232d;
    --timeline-node-bg: #38bdf8;
  }

  /* AÇIK MOD (LIGHT MODE - TAM BEYAZ) */
  html[data-mode="light"] {
    --main-bg: #ffffff;
    --mask-bg: #ffffff;
    --main-border-color: #e1e4e8;
    --sidebar-bg: #f6f8fa;
    --sidebar-border-color: #e1e4e8;
    --card-bg: #ffffff;
    --card-header-bg: #f6f8fa;
    --tb-border-color: #e1e4e8;
    --text-color: #24292f;
    --text-muted-color: #57606a;
    --heading-color: #1f2328;
    --link-color: #0969da;
    --nav-link-color: #57606a;
    --sidebar-active-color: #0969da;
    --topbar-bg: #ffffff;
    --topbar-text-color: #1f2328;
    --search-wrapper-bg: #f6f8fa;
    --search-wrapper-border-color: #d0d7de;
    --tag-bg: #f3f4f6;
    --tag-border: #d0d7de;
    --timeline-color: #d0d7de;
    --timeline-node-bg: #0969da;
  }

  /* 4. GENEL TEMA UYGULAMASI (STİLLER DEĞİŞKENLERE BAĞLANDI) */
  body, #main-wrapper, #topbar-wrapper, #search-result-wrapper {
    background-color: var(--main-bg) !important;
    color: var(--text-color) !important;
  }

  #sidebar {
    background-color: var(--sidebar-bg) !important;
    border-right: 1px solid var(--sidebar-border-color) !important;
  }

  .nav-item .nav-link {
    color: var(--nav-link-color) !important;
  }

  .nav-item.active .nav-link {
    background-color: var(--card-header-bg) !important;
    color: var(--sidebar-active-color) !important;
    border-radius: 8px !important;
  }

  /* Ana Sayfadaki Kartlar (Arşiv Dışındakiler) */
  #post-list .card, .post-content .card {
    background-color: var(--card-bg) !important;
    border: 1px solid var(--main-border-color) !important;
    border-radius: 12px !important;
    box-shadow: none !important;
  }

  /* Arama Kutusu ve Etiketler */
  #search-input, .search-wrapper {
    background-color: var(--search-wrapper-bg) !important;
    border: 1px solid var(--search-wrapper-border-color) !important;
    color: var(--text-color) !important;
  }

  .tag, .post-tag, #access-tags .tag {
    background-color: var(--tag-bg) !important;
    border: 1px solid var(--tag-border) !important;
    color: var(--text-color) !important;
    border-radius: 20px !important;
    padding: 4px 12px !important;
  }

  a {
    color: var(--link-color) !important;
  }

  /* 5. ARŞİV SAYFASI KUTU & ÇİZGİ DÜZELTMESİ (ÇİZGİYİ KAPATAN ARKA PLAN KALDIRILDI) */
  #archives li, 
  #archives .timeline, 
  #archives .timeline > li, 
  #archives .timeline > li > a,
  #archives .timeline .card {
    background-color: transparent !important;
    background: transparent !important;
    box-shadow: none !important;
    border: none !important;
  }

  #archives .timeline {
    border-left: 2px solid var(--timeline-color) !important;
  }

  /* Alt Bilgi (Footer) */
  footer, #footer, .pb-md-3 {
    background-color: transparent !important;
    border-top: 1px solid var(--main-border-color) !important;
    margin-top: 2rem !important;
    padding-top: 1.5rem !important;
  }
</style>
